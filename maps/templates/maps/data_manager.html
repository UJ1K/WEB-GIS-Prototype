<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dataset Manager · Disaster WebGIS</title>
  <style>
    :root{color-scheme:dark;--bg:#031018;--panel:#071b25;--line:#1c323f;--cyan:#52ff9a;--text:#c4d4d9;--muted:#78909c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",sans-serif}main{max-width:1000px;margin:40px auto;padding:0 20px}a{color:var(--cyan)}h1{font-size:24px;color:var(--cyan)}.card{background:var(--panel);border:1px solid var(--line);padding:20px;margin:20px 0}form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;color:var(--muted)}input,select,button{padding:10px;background:#04131b;color:var(--text);border:1px solid var(--line)}button{background:#063345;color:var(--cyan);cursor:pointer}#status{grid-column:1/-1;min-height:20px}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--cyan)}@media(max-width:600px){form{grid-template-columns:1fr}main{margin:20px auto;padding:0 12px}.card{padding:12px}table{font-size:12px}}
  </style>
</head>
<body>
<main>
  <p><a href="/">← Return to map</a></p>
  <h1>Geospatial Data Manager</h1>
  <p>Upload GeoJSON or zipped shapefiles as vector layers, or store GeoTIFF rasters in Supabase Storage.</p>
  <section class="card">
    <form id="uploadForm" enctype="multipart/form-data">
      {% csrf_token %}
      <label>Dataset name<input name="name" maxlength="160" required placeholder="e.g. Flood extent, September"></label>
      <label>Category<select name="category" required><option value="vektor">Vector</option><option value="raster">Satellite raster</option></select></label>
      <label>Dataset file<input name="file" type="file" accept=".zip,.geojson,.json,.tif,.tiff" required></label>
      <div style="display:flex;align-items:end"><button type="submit">Upload dataset</button></div>
      <div id="status" role="status"></div>
    </form>
  </section>
  <section class="card"><h2>Uploaded datasets</h2><table><thead><tr><th>Name</th><th>Type</th><th>Features / file</th><th>Added</th></tr></thead><tbody id="datasetRows"><tr><td colspan="4">Loading…</td></tr></tbody></table></section>
</main>
<script>
const form=document.getElementById('uploadForm'),status=document.getElementById('status'),rows=document.getElementById('datasetRows');
async function readResponse(r){const body=await r.text();try{return body?JSON.parse(body):{}}catch{const preview=body.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,180);if(r.redirected)return {error:'Your session may have expired. Sign in again at /admin/login/.'};return {error:`Server returned a non-JSON response (HTTP ${r.status}). ${preview}`}}}
async function refresh(){try{const r=await fetch('/api/datasets/',{headers:{Accept:'application/json'}});const result=await readResponse(r);if(!r.ok)throw new Error(result.error||`Could not load datasets (HTTP ${r.status}).`);const datasets=result.datasets||[];rows.replaceChildren();if(!datasets.length){rows.innerHTML='<tr><td colspan="4">No uploaded datasets yet.</td></tr>';return}for(const d of datasets){const tr=document.createElement('tr');const count=d.data_type==='vektor'?`${(d.geojson||[]).length} features`:'';tr.innerHTML='<td></td><td></td><td></td><td></td>';tr.cells[0].textContent=d.name;tr.cells[1].textContent=d.data_type;tr.cells[2].textContent=count;if(d.file_url){const a=document.createElement('a');a.href=d.file_url;a.textContent='Open TIFF';a.target='_blank';a.rel='noopener';tr.cells[2].append(a)}tr.cells[3].textContent=new Date(d.created_at).toLocaleString();rows.append(tr)}}catch(e){rows.innerHTML='';const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent=e.message;tr.append(td);rows.append(tr)}}
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Uploading…';const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/datasets/',{method:'POST',headers:{Accept:'application/json'},body:new FormData(form)});const result=await readResponse(r);if(!r.ok)throw new Error(result.error||`Upload failed (HTTP ${r.status}).`);status.textContent='Dataset uploaded.';form.reset();await refresh()}catch(e){status.textContent=e.message}finally{button.disabled=false}});refresh();
</script>
</body>
</html>
